[project]
name = "02_dataautomation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [ "openpyxl>=3.1.5",]

[dependency-groups]
dev = [
   
    "pathlib>=1.0.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
